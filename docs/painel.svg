<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="'gg sans','Segoe UI',Helvetica,Arial,sans-serif">
  <title>Mockup do painel de produtos do bot no Discord</title>
  <rect width="860" height="520" rx="10" fill="#313338"/>
  <!-- barra do canal -->
  <rect width="860" height="44" rx="10" fill="#313338"/>
  <rect y="43" width="860" height="1" fill="#26282c"/>
  <text x="20" y="28" font-size="18" fill="#80848e">#</text>
  <text x="38" y="28" font-size="15" font-weight="600" fill="#f2f3f5">painel-loja</text>

  <!-- mensagem do bot -->
  <circle cx="44" cy="84" r="20" fill="#7c4dff"/>
  <text x="44" y="91" font-size="20" text-anchor="middle" fill="#fff">🛒</text>
  <text x="76" y="78" font-size="15" font-weight="600" fill="#b388ff">shopkeep</text>
  <rect x="204" y="65" width="34" height="16" rx="3" fill="#5865f2"/>
  <text x="221" y="77" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">APP</text>
  <text x="246" y="78" font-size="12" fill="#949ba4">Hoje às 10:00</text>

  <!-- embed -->
  <rect x="76" y="92" width="740" height="268" rx="4" fill="#2b2d31"/>
  <rect x="76" y="92" width="4" height="268" rx="2" fill="#7c4dff"/>
  <text x="98" y="122" font-size="16" font-weight="700" fill="#f2f3f5">🛒 Shopkeep</text>
  <text x="98" y="148" font-size="14" fill="#dbdee1">Escolha um produto no menu abaixo para ver os detalhes e comprar.</text>

  <g font-size="14">
    <text x="98" y="186" font-weight="700" fill="#f2f3f5">📅 Plano Mensal</text>
    <text x="98" y="208" fill="#dbdee1">Acesso completo por 30 dias,</text>
    <text x="98" y="226" fill="#dbdee1">renovável.</text>
    <text x="98" y="248" font-weight="700" fill="#f2f3f5">R$ 29,90</text>

    <text x="348" y="186" font-weight="700" fill="#f2f3f5">🏆 Plano Anual</text>
    <text x="348" y="208" fill="#dbdee1">Acesso completo por 12 meses</text>
    <text x="348" y="226" fill="#dbdee1">com desconto.</text>
    <text x="348" y="248" font-weight="700" fill="#f2f3f5">R$ 299,00</text>

    <text x="598" y="186" font-weight="700" fill="#f2f3f5">🛟 Suporte Premium</text>
    <text x="598" y="208" fill="#dbdee1">Atendimento prioritário e canal</text>
    <text x="598" y="226" fill="#dbdee1">exclusivo por 30 dias.</text>
    <text x="598" y="248" font-weight="700" fill="#f2f3f5">R$ 99,00</text>
  </g>
  <text x="98" y="342" font-size="12" fill="#949ba4">O pagamento acontece num ticket privado.</text>

  <!-- select menu aberto -->
  <rect x="76" y="374" width="500" height="40" rx="4" fill="#1e1f22" stroke="#3f4147"/>
  <text x="94" y="399" font-size="14" fill="#949ba4">Selecione um produto</text>
  <path d="M552 391l6 6 6-6" fill="none" stroke="#b5bac1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- dica: resposta efêmera -->
  <rect x="76" y="428" width="500" height="76" rx="6" fill="#2b2d31"/>
  <rect x="76" y="428" width="4" height="76" rx="2" fill="#2ecc71"/>
  <text x="96" y="452" font-size="14" font-weight="700" fill="#f2f3f5">🏆 Plano Anual</text>
  <text x="96" y="472" font-size="12" fill="#949ba4">Só você vê esta mensagem</text>
  <rect x="96" y="480" width="104" height="18" rx="3" fill="#248046"/>
  <text x="148" y="494" font-size="12" font-weight="600" text-anchor="middle" fill="#fff">🛒 Comprar</text>
</svg>
