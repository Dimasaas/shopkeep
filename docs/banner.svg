<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace">
  <title>Shopkeep</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1052"/>
      <stop offset="1" stop-color="#1b3a8a"/>
    </linearGradient>
    <pattern id="grade" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .cursor { animation: piscar 1.1s steps(1) infinite; }
      .halo { animation: respirar 5s ease-in-out infinite; transform-origin: 1040px 160px; }
      .linha { stroke-dasharray: 6 10; animation: fluir 3s linear infinite; }
      @keyframes piscar { 50% { opacity: 0; } }
      @keyframes respirar { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .6; transform: scale(1.08); } }
      @keyframes fluir { to { stroke-dashoffset: -32; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .halo, .linha { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="320" fill="url(#fundo)"/>
  <rect width="1280" height="320" fill="url(#grade)"/>

  <!-- halo e ícone de carrinho -->
  <circle class="halo" cx="1040" cy="160" r="120" fill="#B388FF" opacity="0.4"/>
  <g transform="translate(980 100)" fill="none" stroke="#00E5FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 6h22l16 70h68l12-50H30"/>
    <circle cx="50" cy="100" r="9" fill="#00E5FF"/>
    <circle cx="100" cy="100" r="9" fill="#00E5FF"/>
  </g>
  <path class="linha" d="M760 160H940" stroke="#B388FF" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- texto -->
  <text x="80" y="118" font-size="20" fill="#B388FF">$ npm start</text>
  <text x="80" y="188" font-size="64" font-weight="700" fill="#ffffff">Shopkeep<tspan class="cursor" fill="#00E5FF">_</tspan></text>
  <text x="80" y="232" font-size="22" fill="#cfd8ff">a loja inteira dentro do seu servidor do Discord</text>
  <text x="80" y="274" font-size="16" fill="#00E5FF">TypeScript · discord.js v14 · Node 20+</text>
</svg>
