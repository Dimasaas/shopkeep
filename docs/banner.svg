<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" font-family="'Trebuchet MS', 'Segoe UI', system-ui, sans-serif">
  <title>Shopkeep: a loja inteira dentro do seu servidor do Discord</title>
  <defs>
    <pattern id="bolas" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#FFF7E6" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="faixa"><rect width="1280" height="48"/></clipPath>
    <clipPath id="toldo"><path d="M60 46 H194 L222 110 H34 Z"/></clipPath>
    <pattern id="listras" width="80" height="60" patternUnits="userSpaceOnUse">
      <rect width="40" height="60" fill="#F472B6"/>
      <rect x="40" width="40" height="60" fill="#FFF7E6"/>
    </pattern>
  </defs>
  <style>
    .balanca { transform-origin: 880px 48px; animation: balanca 3.2s ease-in-out infinite; }
    .carimbo { transform-origin: 1150px 268px; animation: carimbo 4s ease-in infinite; }
    .b1 { animation: sobe 4s ease-out infinite; }
    .b2 { animation: sobe 4s ease-out infinite; animation-delay: .6s; }
    @keyframes balanca { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes carimbo { 0%,55% { transform: rotate(-8deg) scale(1.6); opacity: 0; } 65% { transform: rotate(-8deg) scale(.95); opacity: 1; } 70%,100% { transform: rotate(-8deg) scale(1); opacity: 1; } }
    @keyframes sobe { 0% { opacity: 0; transform: translateY(10px); } 15%,100% { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .balanca, .carimbo, .b1, .b2 { animation: none; } .carimbo { transform: rotate(-8deg); } }
  </style>
  <rect width="1280" height="320" fill="#2D1B4E"/>
  <rect width="1280" height="320" fill="url(#bolas)"/>

  <!-- toldo listrado na largura toda -->
  <g clip-path="url(#faixa)"><rect width="1280" height="48" fill="url(#listras)"/></g>
  <rect y="0" width="1280" height="6" fill="#A3E635"/>

  <!-- logo -->
  <g transform="translate(40 66) scale(0.92)">
    <rect width="256" height="256" rx="56" fill="#2D1B4E" stroke="#A3E635" stroke-width="4"/>
    <rect x="52" y="34" width="152" height="14" rx="7" fill="#A3E635"/>
    <g clip-path="url(#toldo)">
      <rect x="34" y="46" width="31" height="70" fill="#F472B6"/>
      <rect x="65" y="46" width="31" height="70" fill="#FFF7E6"/>
      <rect x="96" y="46" width="31" height="70" fill="#F472B6"/>
      <rect x="127" y="46" width="31" height="70" fill="#FFF7E6"/>
      <rect x="158" y="46" width="31" height="70" fill="#F472B6"/>
      <rect x="189" y="46" width="33" height="70" fill="#FFF7E6"/>
    </g>
    <circle cx="49.5" cy="110" r="15.5" fill="#F472B6"/><circle cx="80.5" cy="110" r="15.5" fill="#FFF7E6"/>
    <circle cx="111.5" cy="110" r="15.5" fill="#F472B6"/><circle cx="142.5" cy="110" r="15.5" fill="#FFF7E6"/>
    <circle cx="173.5" cy="110" r="15.5" fill="#F472B6"/><circle cx="205" cy="110" r="15.5" fill="#FFF7E6"/>
    <path d="M50 138 H206 Q222 138 222 154 V196 Q222 212 206 212 H110 L74 238 L82 212 H66 Q50 212 50 196 Z" fill="#FFF7E6"/>
    <path d="M104 160 H152 L156 204 H100 Z" fill="#A3E635" stroke="#2D1B4E" stroke-width="4" stroke-linejoin="round"/>
    <path d="M114 160 V154 Q128 140 142 154 V160" fill="none" stroke="#2D1B4E" stroke-width="5" stroke-linecap="round"/>
    <path d="M170 156 H198 L206 166 L198 176 H170 Z" fill="#FDE047" stroke="#2D1B4E" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="198" cy="166" r="2.5" fill="#2D1B4E"/>
  </g>

  <!-- texto -->
  <text x="300" y="172" font-size="84" font-weight="700" fill="#FFF7E6">Shopkeep</text>
  <text x="304" y="216" font-size="24" font-weight="700" fill="#A3E635">a loja inteira dentro do seu servidor do Discord</text>
  <text x="304" y="258" font-size="19" fill="#FDE047">painel  ·  ticket privado  ·  pagamento plugável</text>

  <!-- etiqueta de preço pendurada -->
  <g class="balanca">
    <line x1="880" y1="48" x2="880" y2="92" stroke="#FFF7E6" stroke-width="2"/>
    <path d="M834 92 H916 L928 112 L916 132 H834 Z" fill="#FDE047"/>
    <circle cx="880" cy="98" r="3.5" fill="#2D1B4E"/>
    <text x="880" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#2D1B4E">R$ 29,90</text>
  </g>

  <!-- balões de conversa -->
  <g class="b1">
    <path d="M970 78 H1236 Q1252 78 1252 94 V134 Q1252 150 1236 150 H1010 L986 172 L990 150 H986 Q970 150 970 134 Z" fill="#FFF7E6"/>
    <text x="1111" y="121" text-anchor="middle" font-size="21" font-weight="700" fill="#2D1B4E">Quero o Plano Anual!</text>
  </g>
  <g class="b2">
    <path d="M1000 172 H1244 Q1260 172 1260 188 V212 Q1260 228 1244 228 H1040 L1012 250 L1014 228 H1000 Q984 228 984 212 V188 Q984 172 1000 172 Z" fill="#A3E635"/>
    <text x="1122" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#2D1B4E">Pagamento confirmado</text>
  </g>

  <!-- carimbo -->
  <g class="carimbo">
    <rect x="1060" y="246" width="180" height="44" rx="6" fill="none" stroke="#F472B6" stroke-width="5"/>
    <text x="1150" y="278" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="4" fill="#F472B6">VENDIDO</text>
  </g>
</svg>
