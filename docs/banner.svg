<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace">
  <title>Shopkeep</title>
  <defs>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB86B"/>
      <stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0f52"/>
      <stop offset="1" stop-color="#120726"/>
    </linearGradient>
    <mask id="listras">
      <rect width="1280" height="320" fill="#fff"/>
      <rect x="900" y="168" width="280" height="4" fill="#000"/>
      <rect x="900" y="184" width="280" height="6" fill="#000"/>
      <rect x="900" y="201" width="280" height="8" fill="#000"/>
      <rect x="900" y="219" width="280" height="10" fill="#000"/>
    </mask>
    <style>
      .cursor { animation: piscar 1.1s steps(1) infinite; }
      .brilho { animation: respirar 5s ease-in-out infinite; }
      .grade { animation: fluir 4s linear infinite; }
      @keyframes piscar { 50% { opacity: 0; } }
      @keyframes respirar { 0%,100% { opacity: .22; } 50% { opacity: .42; } }
      @keyframes fluir { to { stroke-dashoffset: -24; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .brilho, .grade { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="320" fill="#120726"/>

  <!-- sol synthwave -->
  <circle class="brilho" cx="1040" cy="150" r="130" fill="#FF4FA3"/>
  <circle cx="1040" cy="150" r="96" fill="url(#sol)" mask="url(#listras)"/>

  <!-- chão em perspectiva -->
  <rect x="0" y="232" width="1280" height="88" fill="url(#chao)"/>
  <rect x="0" y="231" width="1280" height="2" fill="#FF4FA3"/>
  <g stroke="#7C5CFF" stroke-opacity="0.7" stroke-width="1.5">
    <path d="M1040 232L240 320M1040 232L520 320M1040 232L800 320M1040 232L1040 320M1040 232L1280 320M1040 232L1560 320"/>
  </g>
  <g class="grade" stroke="#4D8BFF" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="12 12" fill="none">
    <path d="M0 244H1280M0 262H1280M0 288H1280"/>
  </g>

  <!-- texto -->
  <text x="80" y="108" font-size="20" fill="#FFB86B">$ npm start</text>
  <text x="80" y="178" font-size="64" font-weight="700" fill="#FF4FA3">Shopkeep<tspan class="cursor" fill="#FFB86B">_</tspan></text>
  <text x="80" y="222" font-size="22" fill="#F5EEFF">a loja inteira dentro do seu servidor do Discord</text>
  <text x="80" y="272" font-size="16" fill="#C3A8E6">TypeScript · discord.js v14 · Node 20+</text>
</svg>
